{% extends "base.html" %}
{% block content %}
<div class="col-md-7 mx-auto">
    <h4 class="mb-3">Chat with {{ other_user.username }}</h4>

    <div class="border rounded p-3 mb-3" style="height:420px; overflow-y:auto; display:flex; flex-direction:column;">
        {% for msg in chat_messages %}
            <div class="chat-bubble {% if msg.sender == user %}mine{% else %}theirs{% endif %}">
                {{ msg.text }}
                <div class="small opacity-75">{{ msg.created_at|date:"H:i" }}</div>
            </div>
        {% empty %}
            <p class="text-muted m-auto">Say hi to {{ other_user.username }} 👋</p>
        {% endfor %}
    </div>

    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <input type="text" name="text" class="form-control" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
{% endblock %}
