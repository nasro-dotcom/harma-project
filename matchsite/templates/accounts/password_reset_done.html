{% extends "base.html" %}
{% block content %}
<div class="col-md-6 mx-auto text-center">
    <h2 class="mb-3">Check your email 📩</h2>
    <p class="text-muted">
        If an account exists with that email, we just sent a password reset link to it.
        Open your inbox (and check Spam/Junk if you don't see it in a minute) and click the link to continue.
    </p>
    <a href="{% url 'login' %}" class="btn btn-outline-primary mt-2">Back to log in</a>
</div>
{% endblock %}
